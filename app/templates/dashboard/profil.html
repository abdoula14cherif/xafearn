{% extends "dashboard/base.html" %}
{% block title %}Profil{% endblock %}
{% block content %}
<h1 class="page-title">Ton profil</h1>

<div class="card">
  <div style="font-size:12px; color:var(--dim); margin-bottom:4px;">Nom complet</div>
  <div style="font-weight:600; margin-bottom:14px;">{{ user.nom }}</div>

  <div style="font-size:12px; color:var(--dim); margin-bottom:4px;">E-mail</div>
  <div style="font-weight:600; margin-bottom:14px;">{{ user.email }}</div>

  <div style="font-size:12px; color:var(--dim); margin-bottom:4px;">Téléphone</div>
  <div style="font-weight:600; margin-bottom:14px;">{{ user.telephone }}</div>

  <div style="font-size:12px; color:var(--dim); margin-bottom:4px;">Pays</div>
  <div style="font-weight:600;">{{ user.pays }}</div>
</div>

<a href="{{ url_for('auth.deconnexion') }}" class="card" style="display:block; text-align:center; color:var(--red); font-weight:700; border-color:rgba(239,68,68,0.3);">
  Se déconnecter
</a>
{% endblock %}
