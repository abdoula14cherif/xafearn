<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B1526; --card:#16233D; --gold:#F4B93E; --green:#22C55E; --red:#EF4444; --ink:#E9EEF7; --dim:rgba(233,238,247,0.55); --line:rgba(233,238,247,0.1); }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--navy); color:var(--ink); font-family:'Manrope',sans-serif; min-height:100vh; }
  .wrap{ max-width:480px; margin:0 auto; padding:24px 18px 60px; }
  h1{ font-family:'Baloo 2', sans-serif; font-size:22px; margin:0 0 6px; }
  .sub{ font-size:13px; color:var(--dim); margin-bottom:22px; }
  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .nom{ font-weight:700; font-size:15px; }
  .desc{ font-size:12px; color:var(--dim); margin-top:2px; }
  form{ margin:0; }
  button{
    border:none; border-radius:100px; padding:9px 16px; font-weight:700; font-size:12.5px; cursor:pointer;
    white-space:nowrap;
  }
  .btn-actif{ background:rgba(239,68,68,0.15); color:#FCA5A5; }
  .btn-inactif{ background:linear-gradient(90deg,#F2811D,var(--gold)); color:#111; }
  a.back{ color:var(--dim); font-size:13px; display:block; margin-top:20px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Gestion des jeux</h1>
  <div class="sub">Active ou désactive un jeu — les joueurs voient le changement immédiatement.</div>

  {% for jeu in jeux %}
  <div class="card">
    <div>
      <div class="nom">{{ jeu.nom }}</div>
      <div class="desc">{{ jeu.description }}</div>
    </div>
    <form method="POST" action="{{ url_for('admin.toggle_jeu', jeu_id=jeu.id) }}">
      {% if jeu.actif %}
      <button type="submit" class="btn-actif">Désactiver</button>
      {% else %}
      <button type="submit" class="btn-inactif">Activer</button>
      {% endif %}
    </form>
  </div>
  {% endfor %}

  <a href="{{ url_for('dashboard.jeux_hub') }}" class="back">← Retour au dashboard</a>
</div>
</body>
</html>
